# Workflow for generating and publishing Docker images
name: Docker

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            swiftbitcoin/swift-bitcoin
            ghcr.io/swift-bitcoin/swift-bitcoin
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=__tool__-sha-
            type=raw,value=__tool__,enable=${{ github.ref == format('refs/heads/{0}', 'release') }}
            type=raw,value=__tool__-alpha,enable=${{ github.ref == format('refs/heads/{0}', 'alpha') }}
            type=raw,value=__tool__-beta,enable=${{ github.ref == format('refs/heads/{0}', 'beta') }}
            type=semver,pattern={{version}},prefix=__tool__-
            type=semver,pattern={{major}}.{{minor}},prefix=__tool__-
      -
        name: Build
        uses: docker/bake-action@v5
        with:
          files: |
            ./tools/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          push: true

      - name: Export build artifacts (both arches)
        uses: docker/bake-action@v5
        with:
          files: |
            ./tools/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: artifacts

      - name: Collect binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # From amd64 export
          cp dist-amd64/out/bcnode dist/bcnode-linux-amd64
          cp dist-amd64/out/bcutil dist/bcutil-linux-amd64
          # From arm64 export
          cp dist-arm64/out/bcnode dist/bcnode-linux-arm64
          cp dist-arm64/out/bcutil dist/bcutil-linux-arm64
          chmod +x dist/*

      - name: Append tag to filenames
        run: |
          set -euo pipefail
          for f in dist/*-linux-*; do
            base=$(basename "$f")
            mv "$f" "dist/${base}-${TAG}"
          done

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 * > SHA256SUMS.txt

      - name: Create or update GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelase: true
          files: |
            dist/bcnode-linux-amd64-${{ env.TAG }}
            dist/bcnode-linux-arm64-${{ env.TAG }}
            dist/bcutil-linux-amd64-${{ env.TAG }}
            dist/bcutil-linux-arm64-${{ env.TAG }}
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
